; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
check_skip_packages = yes

[core]
lib_compat_mode = strict
lib_deps =
  ArduinoJson
	WebSerial
	ESPAsyncWebServer
	MedianFilterLib
	PID
  Adafruit ST7735 and ST7789 Library
	Adafruit GFX Library
	Adafruit ILI9341
	XPT2046_Touchscreen
	; SPI
	; Swapped from the framework's own bundled BLEDevice.h to this standalone
	; library to match HiBean's official "Skywalker Comm" reference firmware
	; (github.com/MagnmCI/SkiBeanCommunity) exactly -- confirmed via that
	; repo's actual source that it uses NimBLE-Arduino, not the ESP32 Arduino
	; core's own built-in BLE classes. The two wrap the same underlying
	; NimBLE stack but aren't the same library and evidently don't behave
	; identically (e.g. advertised-service-UUID defaults).
	h2zero/NimBLE-Arduino @ ^2.2.3
build_flags =

[env:c6]
extends = core
board = esp32-c6-devkitm-1
monitor_speed = 115200
upload_speed = 921600
build_flags =
	${core.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

[env:s3-mini]
extends = core
board = lolin_s3_mini
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
	esp32_exception_decoder
build_flags =
	${core.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D S3MINI=1
  -D NO_DISPLAY

[env:s3]
extends = core
; Actual chip (confirmed via `esptool flash-id` against the real board):
; ESP32-S3, 16MB flash (quad), 8MB embedded PSRAM (octal) -- matches the
; N16R8 reference docs in src/. The generic "esp32-s3-devkitc-1" profile
; defaults to an 8MB-flash/no-PSRAM variant, which undersized the flash
; partition table and left the 8MB PSRAM completely unused/unavailable.
board = esp32-s3-devkitc1-n16r8
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
	esp32_exception_decoder
; LVGL bring-up (lvgl-ui branch): lv_conf.h lives in include/ (PlatformIO's
; default extra include dir), LV_CONF_INCLUDE_SIMPLE makes lvgl.h find it
; there via a flat #include instead of relative-path search. In theory
; PlatformIO auto-adds include/ to every compile unit's search path, but
; lvgl's own library sources (built as a separate LDF node) came back unable
; to find lv_conf.h -- confirmed via `pio run -v`, no "-I...include" for the
; project's include/ dir shows up anywhere in the actual compile commands.
; Passing it explicitly here sidesteps whatever's dropping it.
lib_deps =
	${core.lib_deps}
	lvgl/lvgl@^9.2.2
build_flags =
	${core.build_flags}
	-D S3=1
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
